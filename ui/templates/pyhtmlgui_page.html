{% extends "pyHtmlGuiBase.html" %}
{% load static %}

{% block head_meta %}
    {{ block.super }}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Ui</title>
{% endblock %}

{% block head_scripts %}
    {{ block.super }}
    <script src="{% static 'js3party/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/marked.umd.js' %}"></script>
    <script src="{% static 'js/tex-mml-chtml.js' %}"></script>

    <script>
        (function() {
            if (window._panelResizeInited) return;
            window._panelResizeInited = true;

            var MIN_W = 180, MAX_W = 600;

            function loadWidth(key, def) {
                try { var v = localStorage.getItem(key); return v ? parseInt(v, 10) : def; }
                catch(e) { return def; }
            }
            function restoreWidths() {
                var s = document.querySelector('.sidebar');
                var r = document.querySelector('.rightpanel');
                if (s) s.style.width = loadWidth('sidebarWidth', 300) + 'px';
                if (r) r.style.width = loadWidth('rightpanelWidth', 300) + 'px';
            }
            restoreWidths();

            var layout = document.querySelector('.layout');
            if (layout) {
                var obs = new MutationObserver(function() {
                    if (!window._panelDragging) restoreWidths();
                });
                obs.observe(layout, { childList: true, subtree: false });
            }

            var handle = null, startX = 0, startW = 0;

            document.addEventListener('mousedown', function(e) {
                var el = e.target.closest('.resize-handle');
                if (!el || el.id === 'terminalResizeHandle') return;
                if (el.id !== 'sidebarResize' && el.id !== 'rightpanelResize') return;
                var panel = el.closest('.sidebar, .rightpanel');
                if (!panel) return;
                handle = el;
                startX = e.clientX;
                startW = panel.getBoundingClientRect().width;
                document.body.classList.add('resizing');
                window._panelDragging = true;
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!handle) return;
                var panel = handle.closest('.sidebar, .rightpanel');
                if (!panel) return;
                var dx = e.clientX - startX;
                var w = handle.id === 'sidebarResize' ? startW + dx : startW - dx;
                w = Math.max(MIN_W, Math.min(MAX_W, w));
                panel.style.width = w + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (!handle) return;
                var panel = handle.closest('.sidebar, .rightpanel');
                if (panel) {
                    var w = parseInt(panel.style.width, 10);
                    if (w) {
                        var key = handle.id === 'sidebarResize' ? 'sidebarWidth' : 'rightpanelWidth';
                        try { localStorage.setItem(key, w); } catch(e) {}
                    }
                }
                handle = null;
                document.body.classList.remove('resizing');
                window._panelDragging = false;
            });
        })();
        
    </script>

    <script>
        function copyMsg(btn) {
            var row = btn.closest('.msg-row');
            if (!row) return;
            var body = row.querySelector('.msg-body');
            if (!body) return;
            var text = (body.innerText || body.textContent || '').trim();
            if (!text) return;
            _copyToClipboard(text, function (ok) {
                if (ok) _flashCopied(btn);
            });
        }

        function _copyToClipboard(text, done) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(
                    function () { done(true); },
                    function () { _copyFallback(text, done); }
                );
            } else {
                _copyFallback(text, done);
            }
        }

        function _copyFallback(text, done) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '-9999px';
            ta.style.left = '-9999px';
            ta.setAttribute('readonly', '');
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            done(ok);
        }

        function _flashCopied(btn) {
            btn.classList.add('copied');
            btn.setAttribute('title', 'Copied!');
            setTimeout(function () {
                btn.classList.remove('copied');
                btn.setAttribute('title', 'Copy');
            }, 2000);
        }
    </script>

{% endblock %}


{% block head_css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css3party/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css3party/d3-flamegraph.css' %}">
    <link rel="stylesheet" href="{% static 'css3party/diff2html.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
{% endblock %}
