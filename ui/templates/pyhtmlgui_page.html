    <script>

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the main split layout
            if (typeof reinitializeAllSplits === 'function') {
                reinitializeAllSplits();
                if (typeof updateSplitControlButtons === 'function') {
                    updateSplitControlButtons();
                } else {
                    console.error("updateSplitControlButtons function not found on DOMContentLoaded.");
                }
            } else {
                console.error("reinitializeAllSplits function not found. Split.js setup failed.");
            }
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => { 
                    reinitializeAllSplits(); 
                    if (typeof updateSplitControlButtons === 'function') {
                        updateSplitControlButtons();
                    }
                }, 100);
            });
        });
        
    </script>

{% endblock %}

        html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent body scroll, manage scroll within specific divs */
        font-family: Arial, sans-serif;
        font-size: 14px; /* Default font size */
        color: #333;
        }
        .gutter {
        background-color: #ced4da;
        flex-shrink: 0;
        background-repeat: no-repeat;
        background-position: 50%;
        transition: background-color 0.1s ease;
        }
        .gutter.gutter-horizontal { /* For vertical split (resizing columns) */
        cursor: ew-resize;
        width: 5px; /* Defined by Split.js gutterSize */
        }
        .gutter.gutter-vertical { /* For horizontal split (resizing rows) */
        cursor: ns-resize;
        height: 5px; /* Defined by Split.js gutterSize */
        }
        .gutter:hover {
        background-color: #adb5bd; /* Slightly darker on hover */
        }
        .gutter .gutter-handle {
        background-color: darkgray;
        position: relative;
        border-radius: 1.5px;
        }
        .gutter .gutter-handle-horizontal {
        left: 1px;
        top: calc((100% - max(75px, 10%)) / 2);
        height: calc(max(75px, 10%));
        width: 3px;
        margin: 0px;
        }
        .gutter .gutter-handle-vertical {
        left: calc((100% - max(75px, 10%)) / 2);
        top: 1px;
        height: 3px;
        width: calc(max(75px, 10%));
        }
        .gutter .gutter-handle-collapsed {
        background-color: red;
        }
        .resizable-container {
        display: flex;
        height: 100%;
        width: 100%;
        /*min-height: fit-content;
        min-width: fit-content;*/
        flex-grow: 1; /* Allows nested containers to fill parent space */
        overflow: hidden; /* Prevent internal scrollbars unless a panel specifically allows it */
        }
        .resizable-container[data-orientation="vertical"] {
        flex-direction: column;
        }
        .resizable-container[data-orientation="horizontal"] {
        flex-direction: row;
        }
        .resizable-panel {
        display: flex;
        flex-grow: 1;
        flex-shrink: 1;
        flex-basis: 0%; /* Split.js will override this with calc() values */
        overflow: auto; /* Allow internal content to scroll */
        min-width: 0; /* Allow flex items to shrink below their content size */
        min-height: 0; /* For vertical flex containers */
        }

        .flex-row {
        display: flex;
        flex-direction: row;
        }
        .flex-column {
        display: flex;
        flex-direction: column;
        }


        /* --- Transitions for Smooth Split Panel Add/Remove --- */
        .resizable-panel.flex-column {
            transition: max-width 0.3s ease, opacity 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            /* max-width: 2000px;  A large value that won't clip the panel */
        }

        .gutter.gutter-horizontal {
            transition: max-width 0.3s ease;
            max-width: 10px; /* A large enough value for the gutter */
        }

    </style>
