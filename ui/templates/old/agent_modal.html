    <!-- Add/Edit Agent Modal -->
    <div id="agentModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="closeAgentModal()">&times;</span>
                <h2 id="agentModalTitle">Add New Agent</h2>
            </div>
            <div class="modal-body">
                <form id="agentForm">
                    <input type="hidden" id="agentId">
                    <div class="form-group">
                        <label for="agentName">Agent Name:</label>
                        <input type="text" id="agentName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="agentDescription">Description:</label>
                        <textarea id="agentDescription" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="agentAvailableTools">Available Tools:</label>
                        <select id="agentAvailableTools" class="form-control" multiple size="5">
                            <!-- ToolDefinition options will be loaded here -->
                        </select>
                        <small class="form-text text-muted">Hold Ctrl/Cmd to select multiple tools.</small>
                    </div>
                    <!-- Add other agent fields as needed later, e.g., model selection -->
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAgentModal()">Cancel</button>
                <button id="saveAgentBtn" class="btn btn-primary">Save Agent</button>
            </div>
        </div>
    </div>
