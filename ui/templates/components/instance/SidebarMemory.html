{% verbatim %}
<script id="SidebarMemoryTemplate" type="text/x-handlebars-template">
    <div class="sidebar-memory-controls">
        <div class="memory-tabs" id="sidebar-memory-track-buttons_{{instancePk}}">
            <!-- Track buttons (e.g., REVIEW, SELF, INSIGHTS) will be rendered here -->
        </div>
    </div>
    <div class="memory-list-container" id="sidebar-memory-list-container_{{instancePk}}">
        <div id="memory-items-actual-list_{{instancePk}}">
            <!-- Memory items for the active track will be rendered here, grouped by layer -->
        </div>
        <div class="no-memory-items-message" id="no-memory-items-message_{{instancePk}}" style="display: none;">
            No memories yet for this track.
        </div>
    </div>
</script>

<script id="SidebarMemoryItemTemplate" type="text/x-handlebars-template">
<div class="memory-track-item-wrapper layer-{{item.layer}}" id="memory-item-wrapper-{{item.id}}">
    <li class="memory-item" id="memory-item-{{item.id}}">
        <div class="memory-item-header">
            <span class="memory-item-index">[{{item.id}}]</span>
            <div class="memory-item-actions-main">
                <button class="btn btn-xs btn-default add-memory-btn" title="Add new item here" data-item-id="{{item.id}}" data-item-track="{{item.track}}" data-item-layer="{{item.layer}}" onclick="addMemoryItem(event, {{instancePk}})"><i class="fa fa-plus"></i></button>
                <button class="btn btn-xs btn-default delete-memory-btn" title="Delete this item" data-item-id="{{item.id}}" data-item-track="{{item.track}}" data-item-layer="{{item.layer}}" onclick="deleteMemoryItem(event, {{instancePk}})"><i class="fa fa-trash"></i></button>
            </div>
        </div>
        <div class="memory-item-body">
            <pre class="memory-item-content"
                 id="memory-item-content-{{item.id}}"
                 contenteditable="true"
                 data-item-id="{{item.id}}"
                 data-item-track="{{item.track}}"
                 data-item-layer="{{item.layer}}"
                 onfocus="handleMemoryFocus(event)"
                 onblur="handleMemoryBlur(event)">{{item.content}}</pre>
            <div class="memory-edit-actions hidden" id="memory-edit-actions-{{item.id}}">
                <button class="btn btn-xs btn-success save-memory-btn" data-item-id="{{item.id}}" onclick="saveMemoryEdit(event, {{instancePk}})">Save</button>
                <button class="btn btn-xs btn-default cancel-memory-btn" data-item-id="{{item.id}}" onclick="cancelMemoryEdit(event)">Cancel</button>
            </div>
        </div>
    </li>
</div>
</script>
{% endverbatim %}
