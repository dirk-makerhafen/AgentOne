{% verbatim %}
<!-- Main container for the Instance Events sidebar tab -->
<script id="SidebarInstance_EventsTemplate" type="text/x-handlebars-template">
    <div class="agent-events-container sidebar-content-area">
        <!-- Event Receiver Functions Section -->
        <div class="event-section">
            <h6>Receiver Functions</h6>
            <p class="small text-muted">Functions on this instance that can be triggered by events.</p>
            <button type="button" class="btn btn-xs btn-success" onclick="event.preventDefault(); renderInstanceEventReceiverForm({{instancePk}})">
                <i class="fa fa-plus"></i> New Receiver
            </button>
            <div id="instance-event-receivers-list_{{instancePk}}" class="sidebar-list">
                <!-- List of receivers will be rendered here -->
            </div>
            <div id="instance-event-receiver-form-container_{{instancePk}}">
                <!-- Form for creating/editing a receiver will be rendered here -->
            </div>
        </div>

        <!-- Event Assignments Section -->
        <div class="event-section">
            <h6>Event Assignments</h6>
            <p class="small text-muted">Events this instance is subscribed to.</p>
            <button type="button" class="btn btn-xs btn-success" onclick="event.preventDefault(); renderInstanceEventSubscriptionForm({{instancePk}})">
                <i class="fa fa-plus"></i> New Assignment
            </button>
            <div id="instance-event-assignments-list_{{instancePk}}" class="sidebar-list">
                <!-- List of assignments will be rendered here -->
            </div>
            <div id="instance-event-assignment-form-container_{{instancePk}}">
                <!-- Form for creating/editing an assignment will be rendered here -->
            </div>
        </div>
    </div>
</script>

<!-- Template for a single Event Receiver Function in the sidebar -->
<script id="SidebarInstance_EventReceiverTemplate" type="text/x-handlebars-template">
    {{#each receivers}}
    <div class="list-item">
        <strong>{{name}}</strong>
        <p class="small text-muted">Event: <code>{{event}}</code></p>
        <div class="item-actions">
            <button type="button" class="btn btn-xs btn-primary" onclick="event.preventDefault(); renderInstanceEventReceiverForm({{../instance_pk}}, {{id}})">Edit</button>
            <button type="button" class="btn btn-xs btn-danger" onclick="event.preventDefault(); instanceEventsApi.deleteReceiver({{id}})">Delete</button>
        </div>
    </div>
    {{/each}}
</script>

<!-- Template for a single Event Assignment in the sidebar -->
<script id="SidebarInstance_EventSubscriptionTemplate" type="text/x-handlebars-template">
    {{#each assignments}}
    <div class="list-item">
        <p>Subscribed to <strong>{{eventHandler.name}}</strong></p>
        <div class="item-actions">
            <button type="button" class="btn btn-xs btn-primary" onclick="event.preventDefault(); renderInstanceEventSubscriptionForm({{../instance_pk}}, {{id}})">Edit</button>
            <button type="button" class="btn btn-xs btn-danger" onclick="event.preventDefault(); instanceEventsApi.deleteAssignment({{id}})">Delete</button>
        </div>
    </div>
    {{/each}}
</script>

<!-- Template for the Event Receiver Function form -->
<script id="SidebarInstance_EventReceiverFormTemplate" type="text/x-handlebars-template">
    <div class="sub-form-container sidebar-form">
        <h6>{{#if receiver.id}}Edit{{else}}Create{{/if}} Receiver</h6>
        <div id="instance-event-receiver-form-{{instance_pk}}">
            <input type="hidden" name="id" value="{{receiver.id}}">
            <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control input-sm" name="name" value="{{receiver.name}}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea class="form-control input-sm" name="description">{{receiver.description}}</textarea>
            </div>
            <div class="form-group">
                <label>Event Type</label>
                <select class="form-control input-sm" name="eventtype">
                    <option value="event_agentinstance_created" {{#if (eq receiver.event 'event_agentinstance_created')}}selected{{/if}}>event_agentinstance_created(agent, agentInstance)</option>
                    <option value="event_conversationMessage_added" {{#if (eq receiver.event 'event_conversationMessage_added')}}selected{{/if}}>event_conversationMessage_added(agent, agentInstance, conversationMessage)</option>
                    <option value="event_llmquery_pre_execute" {{#if (eq receiver.event 'event_llmquery_pre_execute')}}selected{{/if}}>event_llmquery_pre_execute(agent, agentInstance, llmQuery)</option>
                    <option value="event_llmquery_successfull" {{#if (eq receiver.event 'event_llmquery_successfull')}}selected{{/if}}>event_llmquery_successfull(..., llmQuery, llmResponse, conversationMessage)</option>
                    <option value="event_llmquery_failed" {{#if (eq receiver.event 'event_llmquery_failed')}}selected{{/if}}>event_llmquery_failed(llmQuery, llmResponse, conversationMessage)</option>
                    <option value="event_llmresponse_pre_parse" {{#if (eq receiver.event 'event_llmresponse_pre_parse')}}selected{{/if}}>event_llmresponse_pre_parse(..., response_string_full)</option>
                    <option value="event_llmresponse_post_parse" {{#if (eq receiver.event 'event_llmresponse_post_parse')}}selected{{/if}}>event_llmresponse_post_parse(..., response_string_full, parts)</option>
                    <option value="event_llmresponse_pre_tool_calls" {{#if (eq receiver.event 'event_llmresponse_pre_tool_calls')}}selected{{/if}}>event_llmresponse_pre_tool_calls(..., conversationMessage, toolcalls)</option>
                    <option value="event_llmresponse_pre_tool_call" {{#if (eq receiver.event 'event_llmresponse_pre_tool_call')}}selected{{/if}}>event_llmresponse_pre_tool_call(..., conversationMessage, toolcall)</option>
                    <option value="event_llmresponse_post_tool_call" {{#if (eq receiver.event 'event_llmresponse_post_tool_call')}}selected{{/if}}>event_llmresponse_post_tool_call(..., conversationMessage, toolcall)</option>
                    <option value="event_llmresponse_post_tool_calls" {{#if (eq receiver.event 'event_llmresponse_post_tool_calls')}}selected{{/if}}>event_llmresponse_post_tool_calls(..., conversationMessage, toolcalls)</option>
                    <option value="event_llmresponse_finished" {{#if (eq receiver.event 'event_llmresponse_finished')}}selected{{/if}}>event_llmresponse_finished(llmQuery, llmResponse, conversationMessage)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Source Code</label>
                <textarea class="form-control input-sm" name="source" rows="4">{{receiver.source}}</textarea>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="is_public" {{#if receiver.is_public}}checked{{/if}}> Is Public</label>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="enabled" {{#if receiver.enabled}}checked{{/if}}> Enabled</label>
            </div>
            <div class="form-actions">
                <button type="button" id="save-instance-receiver-btn-{{instance_pk}}" class="btn btn-xs btn-primary">Save</button>
                <button type="button" class="btn btn-xs btn-default" onclick="closeInstanceEventReceiverForm({{instance_pk}})">Cancel</button>
            </div>
        </div>
    </div>
</script>

<!-- Template for the Event Assignment form -->
<script id="SidebarInstance_EventSubscriptionFormTemplate" type="text/x-handlebars-template">
    <div class="sub-form-container sidebar-form">
        <h6>{{#if assignment.id}}Edit{{else}}Create{{/if}} Assignment</h6>
        <div id="instance-event-assignment-form-{{instance_pk}}">
            <input type="hidden" name="id" value="{{assignment.id}}">
            <div class="form-group">
                <label>Description</label>
                <textarea class="form-control input-sm" name="description">{{assignment.description}}</textarea>
            </div>
            <div class="form-group">
                <label>Receiver Function</label>
                <select class="form-control input-sm" name="eventHandler_id">
                    {{#each publicReceivers}}
                        <option value="{{this.id}}" {{#if (eq this.id ../assignment.eventHandler.id)}}selected{{/if}}>{{this.name}} (by {{this.agent.name}})</option>
                    {{/each}}
                </select>
            </div>
            <div class="form-actions">
                <button type="button" id="save-instance-assignment-btn-{{instance_pk}}" class="btn btn-xs btn-primary">Save</button>
                <button type="button" class="btn btn-xs btn-default" onclick="closeInstanceEventSubscriptionForm({{instance_pk}})">Cancel</button>
            </div>
        </div>
    </div>
</script>
{% endverbatim %}
