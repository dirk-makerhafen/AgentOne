<div class="resizable-panel sidebar_left_body flex-column" id="sidebarAgentsContainer" data-size-pc=70>
    <div id="agents-list-header" class="sidebar-list-header">
        <span>Agents</span>
        <button id="add-agent-btn" class="btn btn-xs btn-default" title="Add New Agent"  onclick="showAddAgentForm(event)">
            <i class="fa fa-plus"></i>
        </button>
    </div>
    <div class="instance-view-controls">
        <button id="view-by-agent-btn" class="btn btn-default btn-sm active" onclick="switchInstanceView('agent')">
            <i class="fa fa-sitemap"></i> Agents
        </button>
        <button id="view-by-dir-btn" class="btn btn-default btn-sm" onclick="switchInstanceView('dir')">
            <i class="fa fa-folder-open"></i> Directory
        </button>
        <button id="view-by-fork-btn" class="btn btn-default btn-sm" onclick="switchInstanceView('fork')">
            <i class="fa fa-code-fork"></i> Hierarchy
        </button>
    </div>
    <div id="agents-list-body" class="sidebar-list-body">
        <div id="add-agent-form-container" style="display: none;">
            <!-- Inline Add Agent Form will be rendered here -->
        </div>
        <!-- Agent list will be rendered here -->
    </div>
    <div class="sidebar-nav-ribbons">
        <button class="nav-ribbon" onclick="openSystemsTab('mainTabPanel')" draggable="true" ondragstart="dragTab(event, 'tabButton_systems', 'tabContent_systems')">
            <i class="fa fa-tasks"></i> Systems
        </button>
        <button class="nav-ribbon" onclick="openProvidersTab('mainTabPanel')" draggable="true" ondragstart="dragTab(event, 'tabButton_providers', 'tabContent_providers')">
            <i class="fa fa-cloud"></i> API Providers
        </button>
        <button class="nav-ribbon" onclick="openPromptsTab('mainTabPanel')" draggable="true" ondragstart="dragTab(event, 'tabButton_prompts', 'tabContent_prompts')">
            <i class="fa fa-pencil-square-o"></i> Prompts
        </button>
        <button class="nav-ribbon" onclick="openToolRegistryTab('mainTabPanel')" draggable="true" ondragstart="dragTab(event, 'tabButton_tool_registry', 'tabContent_tool_registry')">
            <i class="fa fa-wrench"></i> Tool Registry
        </button>
    </div>
</div>
<div class="resizable-panel flex-column global-console-output-area" id="sidebarConsoleOutputArea" data-size-pc=30>
        <div class="global-console-output-area-header " style="text-align: left; font-weight: bold;">Client Log</div>
</div>
