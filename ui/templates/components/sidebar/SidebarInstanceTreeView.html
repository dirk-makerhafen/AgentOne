{% verbatim %}
<script id="SidebarInstanceHierarchyTreeViewNodeTemplate" type="text/x-handlebars-template">
    <ul class="tree-view-list">
        {{#each nodes}}
            <li>
                <div id="agent_instance_{{id}}" class="tree-leaf-instance {{#if isSelected}}selected-instance{{/if}}" 
                     data-instance-id="{{id}}" onclick="selectAgentInstance(event, {{id}}, '{{name}}')">
                    
                    {{#if children}}
                        <i class="fa fa-caret-right tree-node-toggle" onclick="toggleTreeNode(event)"></i>
                    {{else}}
                        <span class="tree-node-spacer"></span>
                    {{/if}}

                    <i class="fa fa-users tree-node-icon"></i>
                    <span class="tree-node-name">{{name}}</span>
                    <span class="instance-status instance-status-{{status}}">{{status_display}}</span>
                    
                    <div class="agent-actions-menu-container">
                        <div class="agent-actions-menu" onmouseleave="hideAgentMenu(event, 'agent-instance-menu-{{id}}')">
                            <button class="btn btn-xs btn-default burgerbtn" onclick="showAgentMenu(event, 'agent-instance-menu-{{id}}')" title="Agent Instance Actions">
                                <i class="fa fa-bars"></i>
                            </button>
                            <div id="agent-instance-menu-{{id}}" class="agent-menu-dropdown" style="display: none;">
                                <a href="#" onclick="agentInstanceApi.fork('{{id}}'); hideAgentMenu(event, 'agent-instance-menu-{{id}}');">Fork Instance</a>
                                <a href="#" onclick="requestAgentInstanceDeletion(event, '{{id}}', '{{name}}')">Delete Instance</a>
                            </div>
                        </div>
                    </div>
                </div>
                {{#if children}}
                    <div class="tree-node-children" style="display: none;">
                        {{> SidebarInstanceHierarchyTreeViewNodeTemplate nodes=children}}
                    </div>
                {{/if}}
            </li>
        {{/each}}
    </ul>
</script>

<script id="SidebarInstanceDirectoryTreeViewNodeTemplate" type="text/x-handlebars-template">
    <ul class="tree-view-list">
        {{#each nodes}}
            <li>
                {{#if children}}
                    <div class="tree-node-header" onclick="toggleTreeNode(event)">
                        <i class="fa fa-folder tree-node-icon"></i>
                        <span class="tree-node-name">{{name}}</span>
                    </div>
                {{else}}
                    <div id="agent_instance_{{id}}" class="tree-leaf-instance {{#if isSelected}}selected-instance{{/if}}" 
                         data-instance-id="{{id}}" onclick="selectAgentInstance(event, {{id}}, '{{name}}')">
                        <div class="tree-leaf-header">
                            <i class="fa fa-user tree-node-icon"></i>
                            <span class="tree-node-name">{{name}}</span>
                            <span class="instance-status instance-status-{{status}}">{{status_display}}</span>
                             <div class="agent-actions-menu-container">
                                <div class="agent-actions-menu" onmouseleave="hideAgentMenu(event, 'agent-instance-menu-{{id}}')">
                                    <button class="btn btn-xs btn-default burgerbtn" onclick="showAgentMenu(event, 'agent-instance-menu-{{id}}')" title="Agent Instance Actions">
                                        <i class="fa fa-bars"></i>
                                    </button>
                                    <div id="agent-instance-menu-{{id}}" class="agent-menu-dropdown" style="display: none;">
                                        <a href="#" onclick="agentInstanceApi.fork('{{id}}'); hideAgentMenu(event, 'agent-instance-menu-{{id}}');">Fork Instance</a>
                                        <a href="#" onclick="requestAgentInstanceDeletion(event, '{{id}}', '{{name}}')">Delete Instance</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                {{/if}}
                {{#if children}}
                    <div class="tree-node-children" style="display: none;">
                        {{> SidebarInstanceDirectoryTreeViewNodeTemplate nodes=children}}
                    </div>
                {{/if}}
            </li>
        {{/each}}
    </ul>
</script>
{% endverbatim %}
