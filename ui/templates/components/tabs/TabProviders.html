{% verbatim %}
<script id="TabProvidersTemplate" type="text/x-handlebars-template">
    <div id="tabContent_providers" class="resizable-container tab-content" data-orientation="vertical" style="display: none;">
        <div id="providers-list-header" class="sidebar-list-header">
            <span>API Providers</span>
            <button id="add-provider-btn" class="btn btn-xs btn-default" title="Add New Provider" onclick="providerOpenAddModal(event)">
                <i class="fa fa-plus"></i>
            </button>
        </div>
        <div id="providers-list-body" class="sidebar-list-body">
            <!-- Provider list will be rendered here -->
        </div>
    </div>
</script>

<script id="TabProvidersListItemTemplate" type="text/x-handlebars-template">
    <div class="provider-block" id="provider_{{id}}" data-provider-id="{{id}}">
        <div class="provider-summary">
            <div class="provider-info">
                <span class="provider-name">{{name}}</span>
                {{#if url}}<a href="{{url}}" target="_blank" class="provider-url">{{url}}</a>{{/if}}
            </div>
            <div class="provider-actions">
                <button class="btn btn-xs btn-danger delete-provider-btn" title="Delete Provider" onclick="providerDelete(event, '{{id}}', '{{name}}')"><i class="fa fa-trash"></i></button>
            </div>
            <div class="provider-stats">
                <span title="Total LLM Queries">Queries: {{formatNumber total_llm_queries}}</span>
                <span title="Total Prompt Tokens">Prompt: {{formatNumber total_prompt_tokens}}</span>
                <span title="Total Completion Tokens">Completion: {{formatNumber total_completion_tokens}}</span>
            </div>
        </div>
        <div class="provider-details-content">
            <div class="provider-section">
                <h4>Models</h4>
                <ul class="provider-detail-list">
                    {{#if models.length}}
                        {{#each models}}
                            <li class="provider-detail-item" data-model-id="{{this.id}}">
                                <span class="provider-detail-item-name">{{this.name}}</span>
                                <div class="table-item-actions">
                                    <button class="btn btn-xs btn-danger delete-model-btn" title="Delete Model" onclick="modelDelete(event, '{{../id}}', '{{this.id}}', '{{this.name}}')"><i class="fa fa-trash"></i></button>
                                </div>
                                <div class="model-stats">
                                    <span title="Total LLM Queries">Q: {{formatNumber this.total_llm_queries}}</span>
                                    <span title="Total Prompt Tokens">P: {{formatNumber this.total_prompt_tokens}}</span>
                                    <span title="Total Completion Tokens">C: {{formatNumber this.total_completion_tokens}}</span>
                                </div>
                            </li>
                        {{/each}}
                    {{else}}
                        <li class="no-items-message">No models configured.</li>
                    {{/if}}
                </ul>
                <div class="add-item-container">
                    <input type="text" class="form-control input-xs add-model-input" placeholder="Add model name..." onkeypress="modelAddKeypress(event, '{{id}}')">
                    <button class="btn btn-xs btn-default add-model-btn" title="Add Model" onclick="modelAdd(event, '{{id}}')"><i class="fa fa-plus"></i></button>
                </div>
            </div>
            <div class="provider-section">
                <h4>API Keys</h4>
                <ul class="provider-detail-list">
                    {{#if apikeys.length}}
                        {{#each apikeys}}
                            <li class="provider-detail-item" data-key-id="{{this.id}}">
                                
                                <span class="provider-detail-item-name">{{defaultIfEmpty this.comment 'API Key'}}</span>
                                <div class="table-item-actions">
                                    <button class="btn btn-xs btn-danger delete-apikey-btn" title="Delete API Key" onclick="apiKeyDelete(event, '{{../id}}', '{{this.id}}', '{{defaultIfEmpty this.comment 'API Key'}}')"><i class="fa fa-trash"></i></button>
                                </div>
                                <div class="apikey-stats">
                                    <span title="Total LLM Queries">Q: {{formatNumber this.total_llm_queries}}</span>
                                    <span title="Total Prompt Tokens">P: {{formatNumber this.total_prompt_tokens}}</span>
                                    <span title="Total Completion Tokens">C: {{formatNumber this.total_completion_tokens}}</span>
                                </div>
                            </li>
                        {{/each}}
                    {{else}}
                        <li class="no-items-message">No API keys configured.</li>
                    {{/if}}
                </ul>
                <div class="add-item-container">
                    <button class="btn btn-xs btn-default add-apikey-btn" title="Add API Key" onclick="apiKeyOpenAddModal(event, '{{id}}', '{{name}}')"><i class="fa fa-plus"></i> Add Key</button>
                </div>
            </div>
        </div>
    </div>
</script>


<script id="TabProvidersAddProviderModal" type="text/x-handlebars-template">
    <div id="addProviderModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="providerCloseAddModal(event)">&times;</span>
                <h2>Add New API Provider</h2>
            </div>
            <div class="modal-body">
                <form id="addProviderForm">
                    <div class="form-group">
                        <label for="providerName">Provider Name:</label>
                        <input type="text" id="providerName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="providerUrl">Provider URL:</label>
                        <input type="url" id="providerUrl" class="form-control" placeholder="https://api.example.com/v1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="providerCloseAddModal(event)">Cancel</button>
                <button id="saveProviderBtn" class="btn btn-primary" onclick="providerSave(event)">Save Provider</button>
            </div>
        </div>
    </div>
</script>

<script id="TabProvidersEditProviderModal" type="text/x-handlebars-template">
    <div id="editProviderModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="providerCloseEditModal(event)">&times;</span>
                <h2>Edit API Provider</h2>
            </div>
            <div class="modal-body">
                <form id="editProviderForm">
                    <input type="hidden" id="editProviderId">
                    <div class="form-group">
                        <label for="editProviderName">Provider Name:</label>
                        <input type="text" id="editProviderName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="editProviderUrl">Provider URL:</label>
                        <input type="url" id="editProviderUrl" class="form-control" placeholder="https://api.example.com/v1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="providerCloseEditModal(event)">Cancel</button>
                <button id="updateProviderBtn" class="btn btn-primary" onclick="providerUpdate(event)">Save Changes</button>
            </div>
        </div>
    </div>
</script>

<script id="TabProvidersAddApiKey" type="text/x-handlebars-template">
    <div id="addApiKeyModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="apiKeyCloseAddModal(event)">&times;</span>
                <h2>Add API Key for <span id="addApiKeyProviderName"></span></h2>
            </div>
            <div class="modal-body">
                <form id="addApiKeyForm">
                    <input type="hidden" id="addApiKeyProviderId">
                    <div class="form-group">
                        <label for="apiKeyInput">API Key:</label>
                        <input type="text" id="apiKeyInput" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="apiKeyComment">Comment (Optional):</label>
                        <input type="text" id="apiKeyComment" class="form-control" placeholder="e.g., Personal Key, Test Key">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="apiKeyCloseAddModal(event)">Cancel</button>
                <button id="saveApiKeyBtn" class="btn btn-primary" onclick="apiKeySave(event)">Save Key</button>
            </div>
        </div>
    </div>
</script>


{% endverbatim %}
