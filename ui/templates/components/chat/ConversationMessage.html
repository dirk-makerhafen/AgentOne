{% verbatim %}
<!-- Main template for a full ConversationMessage with all its initial parts -->
<script id="ConversationMessageTemplate" type="text/x-handlebars-template">
    <div id="message_id_{{message.id}}" class="conversation-log-item log-type-conversation {{message.role}}-log-item"
         data-id="{{message.id}}" data-created-at="{{message.created_at}}">
        <div class="message-header">
            <strong>[{{formattedTimestamp}}]</strong> <strong>{{message.role}}</strong>
            <span class="message-actions">
                <i title="{{#if message.pin_to_context}}Unpin from context{{else}}Pin to context{{/if}}" class="fa fa-thumb-tack pin-icon {{#if message.pin_to_context}}pinned{{/if}}" 
                   data-message-id="{{message.id}}" 
                   onclick="event.stopPropagation(); togglePinToContext({{message.id}}, {{message.agentInstance_id}})"></i>
                <i title="{{#if message.hide_from_context}}Unhide{{else}}Hide{{/if}} this message from context" class="fa fa-eye-slash hide-icon {{#if message.hide_from_context}}hide_from_context{{/if}}" 
                   data-message-id="{{message.id}}" 
                   onclick="event.stopPropagation(); toggleHideFromContext({{message.id}}, {{message.agentInstance_id}})"></i>
            </span>
        </div>
        <div class="message-content" id="message_parts_container_{{message.id}}">
            {{#each message.parts}}
                {{> ConversationMessagePartTemplate this}}
            {{/each}}
        </div>
    </div>
</script>

<!-- Partial template for rendering a single ConversationMessagePart -->
<script id="ConversationMessagePartTemplate" type="text/x-handlebars-template">
    <div class="message-part" id="message_part_{{id}}" data-part-id="{{id}}" data-part-index="{{index}}">
        {{#if (eq content_type 'IMAGE')}}
            <img src="{{content}}" class="chat-log-image" alt="User uploaded image">
        {{else}}
            {{#if content}}
                {{#if tool_call_id}}
                    {{!-- Content for a tool call is handled within the tool call block --}}
                {{else}}
                    <p class="message-part-chat" style="white-space: pre;text-wrap:auto">{{content}}</p>
                {{/if}}
            {{/if}}
        {{/if}}

        {{#if tool_call_id}}
            <div class="message-toolcall log-toolcall">
                <div class="toolcall-header">
                    <b class="toolcall-status-{{status}}" id="tool_call_status_{{tool_call_id}}">{{status}}</b>
                    <b>{{function_name}}</b>&nbsp;
                    <span class="toolcall-header-args">{{formatArgsForHeader arguments}}</span>
                    <button class="btn btn-xs btn-default log-btn" onclick="toggleElementVisibility(event, 'tool_call_full_{{tool_call_id}}')" title="Show Details"><i class="fa fa-plus"></i> More</button>
                </div>
                <div class="toolcall-full hidden" id="tool_call_full_{{tool_call_id}}">
                    <div class="toolcall-args">Arguments:
<pre>{{jsonStringify arguments}}</pre>
                    </div>
                    <div class="toolcall-result" id="tool_call_result_{{tool_call_id}}">Response:
<pre>{{#if result}}{{jsonStringify result}}{{else}}Pending...{{/if}}</pre>
                    </div>
                </div>
            </div>
        {{/if}}
    </div>
</script>
{% endverbatim %}
