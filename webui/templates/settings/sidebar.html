<div class="sidebar-section"><span>Settings</span></div>
<div class="side-list">
    {% for key, label in settings_tabs %}
    <a class="ws-row{% if key == active_id %} active{% endif %}" href="{% url 'webui:settings_tab' key %}"
       data-sidebar-active-key="{{ key }}">
        <span class="ws-row-info"><span class="ws-row-name">{{ label }}</span></span>
    </a>
    {% endfor %}
</div>
