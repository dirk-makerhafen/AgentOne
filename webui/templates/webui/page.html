{% extends "webui/base.html" %}
{% load webui %}
{% block body %}
<div class="app-titlebar">
    <button class="app-titlebar-hamburger" type="button" data-mobile-sidebar
            aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="app-titlebar-inner"><span class="app-titlebar-title">AgentOne</span></div>
    <div class="app-titlebar-spacer"></div>
</div>
<div class="mobile-overlay" data-mobile-overlay></div>
<div id="connection-banner" class="webui-connection-banner" role="status" aria-live="polite">
    Live updates disconnected — retrying…
</div>
<div class="layout" hx-ext="sse" sse-connect="{{ sse_url|default:global_sse_url }}">
    {% include "webui/shell/_rail.html" %}
    {% include "webui/shell/_sidebar.html" %}
    <main class="main">
        {% block main %}{% endblock %}
    </main>
</div>
{% endblock %}
