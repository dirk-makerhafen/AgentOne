{% load webui %}
<div class="query-card-messages">
    {% for m in messages %}
    <div class="query-message query-message-{{ m.role }}">
        <div class="query-message-role">{{ m.role }}</div>
        <div class="query-message-content">{{ m.text }}</div>
        {% if m.tokens %}<span class="query-message-tokens">{{ m.tokens }} tok</span>{% endif %}
    </div>
    {% empty %}
    <div class="query-message query-message-system">
        <div class="query-message-content">No prompt messages recorded.</div>
    </div>
    {% endfor %}
</div>
<div class="query-card-foot">
    <span class="query-tokens">{{ query.tokens|default:0 }} tokens</span>
    {% if query.created_at %}
        <span class="query-time" title="{{ query.created_at }}">{{ query.created_at|clock }}</span>
    {% endif %}
</div>
