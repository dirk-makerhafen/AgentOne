{% if not workspace %}
<div class="webui-empty-note">This chat has no workspace assigned.</div>
{% else %}
{# Directory controls carry their own hx-target/hx-swap (see directory_browser). #}
<div class="dt-host dt-host-panel">
    <div class="webui-settings-head dt-host-head">
        <span class="detail-card-title">Workspace</span>
        <a class="webui-action-btn" href="{% url 'webui:workspace' workspace.pk %}">Details</a>
    </div>
    {% include "workspaces/parts/directory_browser.html" %}
</div>
{% endif %}
