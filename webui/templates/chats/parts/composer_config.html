<form class="webui-composer-config" method="post"
      action="{% url 'webui:chat_config' session.pk %}"
      id="composer-config"
      hx-post="{% url 'webui:chat_config' session.pk %}"
      hx-trigger="change"
      hx-target="this" hx-swap="outerHTML"
      hx-sync="this:replace">
    {% csrf_token %}
    <input type="hidden" name="composer" value="1">
    {% if composer_setup_editable %}
    <label class="webui-config-field" title="Agent handling this conversation">
        <span class="webui-config-label">Agent</span>
        <select name="agent">
            {% for agent in composer_agents %}
            <option value="{{ agent.pk }}"{% if agent.pk == composer_agent_id %} selected{% endif %}>{{ agent.name }}</option>
            {% endfor %}
        </select>
    </label>
    {% endif %}
    <label class="webui-config-field" title="Which models the picker shows">
        <span class="webui-config-label">Show</span>
        <select name="model_filter">
            {% for value, label in composer_model_filters %}
            <option value="{{ value }}"{% if value == composer_model_filter %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="webui-config-field" title="Model used for the next turn{% if composer_route_label %} — {{ composer_route_label }}{% endif %}">
        <span class="webui-config-label">Model</span>
        <div class="webui-model-row">
            <select name="model">
                <option value=""{% if not composer_model %} selected{% endif %}>Default model</option>
                {% for row in composer_models %}
                <option value="{{ row.name }}"{% if row.name == composer_model %} selected{% endif %}
                        title="{{ row.tier|default:'unranked' }}{% if row.rank %} · #{{ row.rank }}{% endif %}{% if row.free %} · free{% endif %}">
                    {% if row.favorite %}★ {% endif %}{{ row.name }}{% if row.free %} · free{% endif %}
                </option>
                {% endfor %}
                {% if composer_model and composer_model not in composer_model_names %}
                <option value="{{ composer_model }}" selected>{{ composer_model }}</option>
                {% endif %}
            </select>
            {% if composer_model %}
            <button type="button" class="webui-fav-btn{% if composer_model_favorite %} is-favorite{% endif %}"
                    title="{% if composer_model_favorite %}Remove from favourites{% else %}Add to favourites{% endif %}"
                    hx-post="{% url 'webui:chat_config' session.pk %}"
                    hx-vals='{"composer":"1","toggle_favorite":"1","model":"{{ composer_model }}","model_filter":"{{ composer_model_filter }}"}'
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-target="#composer-config" hx-swap="outerHTML">
                {% if composer_model_favorite %}★{% else %}☆{% endif %}
            </button>
            {% endif %}
        </div>
        {% if composer_provider %}
        <span class="webui-config-hint">{{ composer_provider }}{% if composer_key %} · {{ composer_key }}{% endif %}</span>
        {% endif %}
    </label>
    <label class="webui-config-field" title="Reasoning effort for the next turn">
        <span class="webui-config-label">Reasoning</span>
        <select name="reasoning">
            {% for value, label in composer_reasoning_choices %}
            <option value="{{ value }}"{% if value == composer_reasoning %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    {% if composer_setup_editable %}
    <label class="webui-config-field" title="Workspace this chat writes to">
        <span class="webui-config-label">Workspace</span>
        <select name="workspace">
            <option value=""{% if not composer_workspace_id %} selected{% endif %}>No workspace</option>
            {% for workspace in composer_workspaces %}
            <option value="{{ workspace.pk }}"{% if workspace.pk == composer_workspace_id %} selected{% endif %}>{{ workspace.name }}</option>
            {% endfor %}
        </select>
    </label>
    {% endif %}
    <noscript><button class="webui-action-btn" type="submit">Apply</button></noscript>
</form>
