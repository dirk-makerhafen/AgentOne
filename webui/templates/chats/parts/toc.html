<div class="webui-chat-toc" id="chat-toc"
     data-session="{{ session.pk }}"{% if not toc_segments %} hidden{% endif %}>
    <div class="webui-chat-toc-rail" role="navigation" aria-label="Chat sections">
        {% for seg in toc_segments %}
        <button type="button"
                class="webui-chat-toc-item{% if forloop.last %} active{% endif %}"
                data-toc-pk="{{ seg.pk }}"
                data-toc-index="{{ seg.index }}"
                title="{{ seg.label }}"
                aria-label="{{ seg.label }}"></button>
        {% endfor %}
    </div>
</div>
