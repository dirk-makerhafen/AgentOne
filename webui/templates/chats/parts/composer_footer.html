{% load webui %}
<div class="composer-footer" id="composer-footer">
    <div class="composer-footer-tools">
        <button class="webui-cmd-btn" type="button" data-cmd-toggle
                title="Slash commands" aria-label="Slash commands">/</button>
        <button class="webui-attach-btn" type="button" data-attach
                title="Attach images" aria-label="Attach images">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
        </button>
        {% if composer_config_visible %}
        {% include "chats/parts/composer_config.html" %}
        {% endif %}
    </div>
    {% include "chats/parts/composer_actions.html" %}
</div>
