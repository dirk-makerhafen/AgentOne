# Free / free-tier online LLM providers
# Each provider has models accessible without upfront payment.
# `free_info.api_key_url` tells the user where to get an API key.
# `free_info.setup_instructions` explains any quirks (rate limits, VPN, etc.).
# Rate-limit fields: 0 = unlimited.

providers:
  - name: Google
    url: https://generativelanguage.googleapis.com/v1beta/
    free_info:
      api_key_url: https://aistudio.google.com/apikey
      setup_instructions: >
        Create a Google account (or use an existing one), visit the API key page
        above, click "Create API key", and paste it into the Google API key field
        in AgentOne settings. The free tier includes Gemini 2.5 Flash with generous
        rate limits (1500 RPM, 1M TPM for Flash).
    models:
      - name: gemini-2.5-flash
        family: gemini
        is_cloud: true
        context_length: 1048576
        vision: true
        supports_reasoning: false
        supports_tool_call: true
