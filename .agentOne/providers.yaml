providers:
- name: Ollama
  url: http://localhost:11434/v1/
  is_local: true

- name: OMLX
  url: http://127.0.0.1:8000/v1
  is_local: true


- name: Nvidia
  url: https://integrate.api.nvidia.com/v1
  free_info:
    RPM: 40
    api_key_url: https://build.nvidia.com/settings/api-keys
    setup_instructions: 'Sign up at build.nvidia.com. Free NVIDIA Developer account. No credit card.
      Get NVIDIA NIM API key → Go to Settings → API Keys -> Generate an API key'
    free_models:
      - model: GLM 5.2
        id: z-ai/glm-5.2
      - model: Deepseek V4 Flash
        id: deepseek-ai/deepseek-v4-flash-0731
      - model: Kimi K2.6
        id: moonshotai/kimi-k2.6
      - model: Nemotron 3 Ultra 550B A55B
        id: nvidia/nemotron-3-ultra-550b-a55b


- name: Google
  url: https://generativelanguage.googleapis.com/v1beta
  free_info:
    RPM: 15
    RPD: 1500
    api_key_url: https://aistudio.google.com/app/apikey
    setup_instructions: 'Create a Google account (or use an existing one), visit the
      API key page above, click "Create API key", and paste it into the Google API
      key field below.'
    free_models:
      - model: Gemini 3.6 Flash
        id: gemini-3.6-flash


- name: Ollama Cloud
