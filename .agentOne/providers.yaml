providers:
- name: Ollama
  url: http://localhost:11434/v1/
  is_local: true
- name: OMLX
  url: http://127.0.0.1:8000/v1
  is_local: true
- name: Google
  url: https://generativelanguage.googleapis.com/v1beta/
  free_info:
    api_key_url: https://aistudio.google.com/apikey
    setup_instructions: 'Create a Google account (or use an existing one), visit the
      API key page above, click "Create API key", and paste it into the Google API
      key field in AgentOne settings. The free tier includes Gemini 2.5 Flash with
      generous rate limits (1500 RPM, 1M TPM for Flash).'
- name: Groq
  url: https://api.groq.com/openai/v1
  free_info:
    api_key_url: https://console.groq.com/keys
    setup_instructions: 'Sign up at console.groq.com (free, no credit card), go to
      API Keys, create a key, and paste it in AgentOne settings. Free tier offers
      30 RPM and 14,400 RPD on most models.'
- name: OpenRouter
  url: https://openrouter.ai/api/v1
  free_info:
    api_key_url: https://openrouter.ai/keys
    setup_instructions: 'Create a free account at openrouter.ai, generate an API key
      under "Keys", and enter it in AgentOne settings. OpenRouter aggregates dozens
      of free models from multiple providers. Check https://openrouter.ai/models?free=1
      for the current list of free models. Requires a free plan (may ask for credit
      card for paid models, but free models work without it).'
- name: DeepSeek
  url: https://api.deepseek.com/v1
  free_info:
    api_key_url: https://platform.deepseek.com/api_keys
    setup_instructions: 'Sign up at platform.deepseek.com, go to API Keys, create
      a key (free tier available with 10M tokens). Paste the key in AgentOne settings.
      Rate limits are generous (500 RPM for free tier).'
- name: Together AI
  url: https://api.together.xyz/v1
  free_info:
    api_key_url: https://api.together.xyz/settings/api-keys
    setup_instructions: 'Sign up at together.ai (free, no credit card), go to Settings
      > API Keys, create a key, paste in AgentOne. Free tier includes $1 credit and
      access to several open models.'
- name: Alibaba Cloud
  url: https://dashscope.aliyuncs.com/compatible-mode/v1
  free_info:
    api_key_url: https://bailian.console.aliyun.com/
    setup_instructions: 'Register at aliyun.com, activate the DashScope (Model Studio)
      service, create an API key in the console. Free tier offers 2M tokens for Qwen
      models. The API is OpenAI-compatible. Note: Chinese phone number recommended
      for signup.'
- name: Zhipu AI
  url: https://open.bigmodel.cn/api/paas/v4
  free_info:
    api_key_url: https://open.bigmodel.cn/usercenter/apikeys
    setup_instructions: 'Register at open.bigmodel.cn (Chinese platform, may need
      phone/WeChat), create an API key under User Center. Free tier gives 2M tokens
      for GLM models. OpenAI-compatible API.'
- name: SiliconFlow
  url: https://api.siliconflow.cn/v1
  free_info:
    api_key_url: https://siliconflow.cn/account/api-key
    setup_instructions: 'Register at siliconflow.cn (Chinese signup, phone recommended),
      create an API key. Free tier includes 2M tokens for most models. OpenAI-compatible.
      Good coverage of Chinese and English models.'
- name: OpenCode Zen
  url: https://opencode.ai/zen/v1
  free_info:
    api_key_url: https://opencode.ai/auth
    default_api_key: public
    setup_instructions: 'OpenCode Zen provides free models without requiring an API
      key. In Settings → Providers → OpenCode Zen, leave the API key empty. Our system
      will automatically use "public" as the auth token, which the Zen gateway accepts
      for free-tier models. For full access (paid models), sign up at opencode.ai/auth
      and paste your Zen API key.'
- name: Ollama Cloud
  url: https://ollama.com/v1
  free_info:
    api_key_url: https://ollama.com/settings/keys
    setup_instructions: 'Ollama Cloud runs hosted models either through your local
      Ollama setup or directly at ollama.com. Create a free account at ollama.com,
      generate an API key under Settings > Keys, and paste it in AgentOne. When a
      local Ollama installation has cloud models enabled, they appear in its /v1/models
      list with a "-cloud" tag — those are routed to this provider instead of the
      local Ollama card. Model ids here match ollama.com (no "-cloud" suffix).'


