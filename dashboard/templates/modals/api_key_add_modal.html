    <!-- Add API Key Modal -->
    <div id="addApiKeyModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="document.getElementById('addApiKeyModal').style.display='none'">&times;</span>
                <h2>Add API Key for <span id="addApiKeyProviderName"></span></h2>
            </div>
            <div class="modal-body">
                <form id="addApiKeyForm">
                    <input type="hidden" id="addApiKeyProviderId">
                    <div class="form-group">
                        <label for="apiKeyInput">API Key:</label>
                        <input type="text" id="apiKeyInput" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="apiKeyComment">Comment (Optional):</label>
                        <input type="text" id="apiKeyComment" class="form-control" placeholder="e.g., Personal Key, Test Key">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="document.getElementById('addApiKeyModal').style.display='none'">Cancel</button>
                <button id="saveApiKeyBtn" class="btn btn-primary">Save Key</button>
            </div>
        </div>
    </div>
