    <!-- Add Tool Definition Modal -->
    <div id="addToolDefinitionModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="closeToolDefinitionModal()">&times;</span>
                <h2 id="addToolDefinitionModalTitle">Register New Tool Definition</h2>
            </div>
            <div class="modal-body">
                <form id="addToolDefinitionForm">
                    <div class="form-group">
                        <label for="addToolDefinitionDisplayName">Display Name:</label>
                        <input type="text" id="addToolDefinitionDisplayName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="addToolDefinitionName">Internal Name:</label>
                        <input type="text" id="addToolDefinitionName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="addToolDefinitionDescription">Description:</label>
                        <textarea id="addToolDefinitionDescription" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <input type="checkbox" id="addToolDefinitionIsBuiltin" disabled>
                        <label for="addToolDefinitionIsBuiltin">Built-in Tool (cannot be changed)</label>
                    </div>
                    <div class="form-group external-tool-fields">
                        <label for="addToolDefinitionTransportType">Transport Type (for external tools):</label>
                        <select id="addToolDefinitionTransportType" class="form-control" required>
                            <option value="tcp">TCP Socket (HTTP/S)</option>
                            <option value="stdin_stdout">Standard I/O (stdin/stdout)</option>
                        </select>
                    </div>
                    <div class="form-group external-tool-fields">
                        <label for="addToolDefinitionRepoUrl">Repository URL (for external tools):</label>
                        <input type="url" id="addToolDefinitionRepoUrl" class="form-control" placeholder="https://github.com/org/repo">
                    </div>
                    <div class="form-group external-tool-fields">
                        <label for="addToolDefinitionCommand">Command to run (for external tools):</label>
                        <input type="text" id="addToolDefinitionCommand" class="form-control" placeholder="python main.py">
                    </div>
                    <div class="form-group external-tool-fields">
                        <label for="addToolDefinitionArgs">Arguments (for external tools, JSON array):</label>
                        <input type="text" id="addToolDefinitionArgs" class="form-control" placeholder='["--port", "8080"]'>
                    </div>
                    <div class="form-group external-tool-fields">
                        <label for="addToolDefinitionPlatforms">Platforms (for external tools, comma-separated):</label>
                        <input type="text" id="addToolDefinitionPlatforms" class="form-control" placeholder="linux,windows">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeToolDefinitionModal()">Cancel</button>
                <button id="saveToolDefinitionBtn" class="btn btn-primary">Register Tool</button>
            </div>
        </div>
    </div>
