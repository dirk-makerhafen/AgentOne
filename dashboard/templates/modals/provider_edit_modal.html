    <!-- Edit Provider Modal -->
    <div id="editProviderModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="document.getElementById('editProviderModal').style.display='none'">&times;</span>
                <h2>Edit API Provider</h2>
            </div>
            <div class="modal-body">
                <form id="editProviderForm">
                    <input type="hidden" id="editProviderId">
                    <div class="form-group">
                        <label for="editProviderName">Provider Name:</label>
                        <input type="text" id="editProviderName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="editProviderUrl">Provider URL:</label>
                        <input type="url" id="editProviderUrl" class="form-control" placeholder="https://api.example.com/v1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="document.getElementById('editProviderModal').style.display='none'">Cancel</button>
                <button id="updateProviderBtn" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>
